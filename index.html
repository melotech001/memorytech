<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TechMemory - Sistema de Estudos</title>
    <meta name="description" content="Centralize seus estudos de forma organizada - Funciona offline">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="loading-overlay active" id="loadingOverlay">
        <div class="spinner"></div>
        <div style="color: var(--primary);">Carregando...</div>
    </div>

    <div class="app-container" id="appContainer">

        <button class="mobile-menu-toggle" onclick="toggleSidebar()">☰</button>

        <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

        <div class="sidebar" id="sidebar">
            <div class="logo">⚡ TechMemory</div>

            <div class="sidebar-section">
                <div class="sidebar-title">MENU</div>
                <div class="nav-item active" data-page="dashboard">📊 Dashboard</div>
                <div class="nav-item" data-page="global-search">🔍 Busca Global</div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">MÓDULOS</div>
                <div class="nav-item" data-page="notes">📝 Anotações</div>
                <div class="nav-item" data-page="bookmarks">🔖 Sites Favoritos</div>
                <div class="nav-item" data-page="study-ideas">💡 Ideias de Estudo</div>
                <div class="nav-item" data-page="projects">🚀 Projetos</div>
                <div class="nav-item" data-page="tasks">✅ Tarefas</div>
                <div class="nav-item" data-page="reminders">⏰ Lembretes</div>
                <div class="nav-item" data-page="tags">🏷️ Etiquetas</div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">SEGURANÇA</div>
                <div class="nav-item" id="protectModeBtn">🔐 Proteger Itens (Seleção)</div>
                <div class="nav-item" data-page="vault">🔒 Cofre Pessoal</div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">SISTEMA</div>
                <div class="nav-item" data-page="stats">📈 Estatísticas</div>
                <div class="nav-item" id="backupBtn">💾 Backup</div>
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <div class="search-bar">
                    <input type="text" id="globalSearchInput" placeholder="🔍 Buscar em tudo..." style="width: 100%;">
                    <button class="btn btn-primary btn-sm" onclick="performGlobalSearch()">Buscar</button>
                </div>
                <div class="header-info">
                    <span id="currentDateTime"></span>
                </div>
            </div>
            <div id="pageContent"></div>
        </div>
    </div>

    <div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <div class="online-status" id="onlineStatus">🟢 Online</div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
